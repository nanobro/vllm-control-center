[project]
name = "vllm-control-center-controller"
version = "0.62.0"
description = "FastAPI controller for vLLM Control Center"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "PyYAML>=6.0.2"
]

[project.optional-dependencies]
huggingface = [
  "huggingface_hub>=0.24.0"
]
keychain = [
  "keyring>=25.0.0"
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
